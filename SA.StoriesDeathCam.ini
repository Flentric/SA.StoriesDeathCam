[StoriesDeathCam]
; StoriesDeathCam: the camera spins overhead and rises as you die, then the
; screen washes to grey.
; Settings reload live while you play - tweak and see it on your next death.

; --- Camera ---
; Orbit distance from the body. 0 = directly overhead, straight-down top-down.
; Raise slightly for a tilted 3/4 angle instead:
Radius=0.0
; How much the orbit distance grows per second (pulls out as it climbs):
RadiusGrow=0.0
; Camera height above the body at the start (lower = closer to CJ):
HeightStart=2.0
; How fast the camera climbs into the sky, per second (lower = gentler):
RiseSpeed=2.5
; Spin speed in degrees per second (the view rotation; negative = other way):
SpinSpeed=55.0
; Height on the body the camera aims at:
LookHeight=0.3
; Camera field of view:
FOV=70.0

; --- Death sequence length ---
; Delay (ms) before the game fades out and respawns you. SA default is 3000
; (~5s total); 2000 gives a ~4s sequence. 0 = leave SA's timer untouched.
; Applied once at load - restart the game after changing this.
WastedDelayMs=2000

; --- Screen wash (covers the HUD and "wasted" text as it fills) ---
; Seconds to wait before the wash starts:
WashDelay=2.3
; Seconds for the wash to go from clear to full once it starts:
WashInTime=1.2
; Wash colour (medium grey; raise all three toward 255 for white/lighter):
FadeR=110
FadeG=112
FadeB=110
; Maximum wash opacity, 0-255:
MaxWash=255
